    "python-dotenv==1.0.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart==0.0.9",
    "sentence-transformers==3.0.1",
    "Sastrawi>=1.0.1",
    "slowapi==0.1.9",
    "temporalio>=1.8.0",
    "tenacity==9.1.4",
    "uvicorn[standard]==0.30.6",
    "langchain-groq>=0.3.2",
