    "asyncpg>=0.29.0",
    "bcrypt>=5.0.0",
    "fastapi==0.115.0",
    "minio>=7.2.7",
    "httpx==0.28.1",
    "langchain==0.3.13",
    "langchain-milvus>=0.2.0",
