# EnterpriseMind AI — Docker Compose
# Milvus (Vector DB, standalone local) + Temporal + PostgreSQL (application DB)
# Backend & Temporal Worker tetap run locally di host (uvicorn / python -m app.temporal.worker)
#
# Catatan per plan_optimasi.md:
#   Fase 2: Docling tidak lagi di stack (ekstraksi tabel PyMuPDF native).
#   Fase 4: Milvus memakai etcd EMBEDDED + storage LOKAL (bukan container
#          milvus-etcd / MinIO). milvus-minio tetap = object store DOKUMEN app.

services:
  milvus:
    image: milvusdb/milvus:v2.5.6
    container_name: enterprisemind_milvus
    # etcd embedded + storage lokal — 3 container Milvus menjadi 1 (Fase 4).
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local          # tidak lagi memakai MinIO utk segmen
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
      - ./docker/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    command: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - enterprisemind_net

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: enterprisemind_minio
    # Sejak Fase 4: minio TIDAK lagi backend storage Milvus (storage lokal).
    # Perannya sekarang: object store dokumen aplikasi (MINIO_BUCKET_DOCS,
    # dipakai app/core/minio_client.py, upload/documents API, temporal activities).
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - enterprisemind_net

  temporal:
    image: temporalio/auto-setup:1.24.0
    container_name: enterprisemind_temporal
    # Temporal memakai PostgreSQL aplikasi (postgres-app) yang sama.
    # auto-setup membuat database temporal & temporal_visibility otomatis
    # saat pertama kali connect (user postgres = superuser).
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-Password}
      - POSTGRES_SEEDS=postgres-app
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
    ports:
      - "7233:7233"
    depends_on:
      postgres-app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - enterprisemind_net

  postgres-app:
    image: postgres:16-alpine
    container_name: enterprisemind_postgres
    environment:
      - POSTGRES_DB=enterprisemind
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Password}
    # Sekarang menampung 2 database: enterprisemind (app) + temporal (+temporal_visibility).
    # max_connections dinaikkan ke 200 agar cukup untuk app + Temporal.
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/init/02-admin-user.sql:/docker-entrypoint-initdb.d/02-admin-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprisemind"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - enterprisemind_net

volumes:
  milvus_minio:
    driver: local
  milvus_data:
    driver: local
  postgres_app_data:
    driver: local

networks:
  enterprisemind_net:
    driver: bridge
