services:
  backend:
    build: .
    container_name: enterprisemind_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - chroma_data:/app/chroma_db
      - uploads:/app/uploads
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - enterprisemind_net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: enterprisemind_chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprisemind_net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

volumes:
  chroma_data:
    driver: local
  uploads:
    driver: local

networks:
  enterprisemind_net:
    driver: bridge
