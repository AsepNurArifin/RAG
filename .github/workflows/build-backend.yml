name: Build & Push Backend Image

# Bangun image backend di CI (bukan di VPS) lalu push ke GHCR.
# VPS cukup `docker compose pull` → tidak ada build cache di VPS
# (hemat 3-5 GB disk — plan_optimasi.md Fase 1).

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # HANYA arch VPS (amd64) — jangan multi-arch agar image sekecil mungkin
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/enterprisemind-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/enterprisemind-backend:latest
          # Cache disimpan di GitHub Actions (BUKAN di VPS)
          cache-from: type=gha
          cache-to: type=gha,mode=max
